plugins {
    id 'com.android.application'
}

android {
    namespace 'com.banglasticker.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.banglasticker.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // Authority of the sticker ContentProvider that WhatsApp reads from.
        def contentProviderAuthority = applicationId + ".stickercontentprovider"
        manifestPlaceholders = [contentProviderAuthority: contentProviderAuthority]
        buildConfigField "String", "CONTENT_PROVIDER_AUTHORITY", "\"${contentProviderAuthority}\""
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        noCompress 'webp'
    }

    // Fixed test-only signing key so every CI/local build is signed identically;
    // this lets new APKs install over previous ones without uninstalling.
    signingConfigs {
        debug {
            storeFile file('keystore.jks')
            storePassword 'banglasticker'
            keyAlias 'bangla'
            keyPassword 'banglasticker'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
